<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You have a card | Even Here</title>
<meta name="description" content="Someone sent you a card with Even Here." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0F3B2E" />
<meta property="og:title" content="Someone sent you a card" />
<meta property="og:description" content="Tap to open it." />
<meta property="og:image" content="assets/cards/og-envelope.png" />
<link rel="icon" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="card.css" />
</head>
<body>
<main class="stage" id="stage">
  <p class="from-line" id="fromLine">You have a card</p>

  <div class="envelope" id="envelope" aria-hidden="false">
    <div class="env-back"></div>
    <article class="card" id="card" aria-live="polite">
      <img class="art" id="art" alt="" width="1536" height="1152" />
      <div class="inside">
        <h1 id="title"></h1>
        <p class="to" id="to"></p>
        <p class="msg" id="msg"></p>
        <figure class="verse" id="verse" hidden>
          <blockquote id="vtext"></blockquote>
          <figcaption id="vref"></figcaption>
        </figure>
        <section class="prayer" id="prayer" hidden>
          <h2 id="prTitle">A prayer for you</h2>
          <p id="prText"></p>
          <p class="prayer-by" id="prBy"></p>
        </section>
        <p class="sig" id="sig"></p>
      </div>
    </article>
    <div class="env-front"><span class="env-to" id="envTo"></span></div>
    <div class="env-flap"></div>
    <button class="seal" id="open" type="button" aria-label="Open your card"><img src="assets/logo.png" alt="" width="40" height="40" /></button>
  </div>

  <button class="open-btn" id="openBtn" type="button">Open your card</button>

  <footer class="after" id="after">
    <section class="gift" id="gift" aria-label="Your free gift">
      <span class="gift-tag">A little gift for you</span>
      <b></b>
      <p id="giftNote">A short Bible reading for each day, free in your browser. No app, no sign-up and no payment.</p>
      <button type="button" class="gift-btn" id="giftStart">Start day 1</button>
      <div class="reader" id="reader" hidden>
        <div class="reader-day" id="rDay"></div>
        <blockquote id="rText"></blockquote>
        <p class="reader-ref" id="rRef"></p>
        <p class="reader-thought" id="rThought"></p>
        <p class="reader-label">Thought written by Even Here. The verse is the Bible text.</p>
        <div class="reader-nav"><button type="button" id="rPrev">Previous</button><button type="button" id="rNext">Next day</button></div>
      </div>
    </section>
    <button type="button" class="keep-btn" id="keep">Save this card</button>
    <p>Sent with care using Even Here.</p>
    <a href="../">What is Even Here?</a>
  </footer>
</main>
<script src="card-gifts.js" defer></script>
<script src="card.js" defer></script>
</body>
</html>
